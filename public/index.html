mine(){const H=R.filter(c=>c.st=="Hired"),n=H.length,one={},pr={};
 H.forEach(c=>{const s=[...c.sk].sort();s.forEach(x=>one[x]=(one[x]||0)+1);for(let i=0;i<s.length;i++)for(let k=i+1;k<s.length;k++){const key=s[i]+"|"+s[k];pr[key]=(pr[key]||0)+1}});
 const rules=[];Object.entries(pr).forEach(([k,c])=>{const[a,b]=k.split("|");if(c/n<.12)return;[[a,b],[b,a]].forEach(([x,y])=>{const cf=c/one[x];if(cf>=.6)rules.push([x,y,c/n,cf,cf/(one[y]/n)])})});
 rules.sort((p,q)=>q[4]-p[4]);
 const g={};R.forEach(c=>{const b=c.exp<1?"Fresher (<1 yr)":c.exp<3?"Junior (1-3)":c.exp<5?"Mid (3-5)":"Senior (5+)";(g[b]=g[b]||{n:0,h:0,c:0,sal:0});g[b].n++;g[b].h+=c.st=="Hired";g[b].c+=c.cgpa;g[b].sal+=c.sal});
 return $(`<div class="card"><h2>Association rules (hired candidates)</h2><p class="note">"A => B" means hired candidates with A often also have B. Lift above 1 means the link is stronger than chance.</p>${tab(0,rules.slice(0,8).map(r=>[r[0],r[1],r[2].toFixed(2),r[3].toFixed(2),r[4].toFixed(2)]),["If skill","Then skill","Support","Confidence","Lift"])}<h2>Segments by experience</h2>${tab(0,Object.entries(g).map(([b,x])=>[b,x.n,(100*x.h/x.n).toFixed(0)+"%",(x.c/x.n).toFixed(2),(x.sal/x.n).toFixed(1)]),["Band","Candidates","Hired","Avg CGPA","Avg salary (LPA)"])}<p class="note">The Python project also runs K-Means clustering, a Decision Tree (skill match was the strongest factor) and TF-IDF text matching.</p></div>`)},
live(){const el=$(`<div class="card"><p>These buttons call the deployed API (MongoDB, in-memory star-schema warehouse, Neo4j with Python fallback).</p>
<div class="row"><button class="chip" data-u="/api/health">Health</button><button class="chip" data-u="/api/rank/J004?top=5">Rank J004 (MongoDB)</button><button class="chip" data-u="/api/search?skills=Python,SQL&min_exp=2&min_cgpa=7.5">Search (MongoDB)</button><button class="chip" data-u="/api/skills/top">Top skills</button><button class="chip" data-u="/api/warehouse">Warehouse OLAP</button><button class="chip" data-u="/api/mining">Data mining</button><button class="chip" data-u="/api/graph/related?skill=Neo4j">Graph: related skills</button><button class="chip" data-u="/api/graph/gap?candidate=C001&job=J004">Graph: skill gap</button><button class="chip" data-u="/api/graph/match?job=J004">Graph: job match</button></div>
<p class="note" id="st">Click a button to run a request.</p><div id="o"></div></div>`);
 const cell=x=>Array.isArray(x)?x.join(", "):(x&&typeof x=="object")?JSON.stringify(x):x??"-";
 const render=(d)=>{if(Array.isArray(d)&&d.length&&typeof d[0]=="object"){const k=Object.keys(d[0]);return tab(0,d.map(r=>k.map(c=>cell(r[c]))),k)}
  if(d&&typeof d=="object"&&!Array.isArray(d)){return Object.entries(d).map(([k,v])=>`<h2>${k}</h2>`+(v&&v.columns?tab(0,v.rows,v.columns):typeof v=="string"?`<pre style="overflow:auto">${v}</pre>`:render(v))).join("")}
  return `<p>${cell(d)}</p>`};
 el.querySelectorAll("[data-u]").forEach(b=>b.onclick=async()=>{const st=el.querySelector("#st"),o=el.querySelector("#o");st.textContent="Loading...";o.innerHTML="";
  try{const r=await fetch(b.dataset.u);const d=await r.json();st.innerHTML=`<b>${r.status}</b> GET ${b.dataset.u}${d.source?" | source: <b>"+d.source+"</b>":""}`;o.innerHTML=render(d.results||d)}
  catch(e){st.textContent="API not reachable. Open this page from the deployed site (or run python api/index.py locally)."}});
 return el},
about(){return $(`<div class="card"><h2>How it works</h2><p><b>JSON</b> resumes and jobs are loaded into <b>MongoDB</b> (indexes, CRUD, queries, aggregation and a candidate scoring pipeline).</p><p><b>Neo4j</b> stores the graph Candidate - HAS_SKILL - Skill - REQUIRES - Job, used for skill gaps and skill recommendations.</p><p>An ETL step moves the data into a <b>star schema data warehouse</b> (fact_application + candidate, job, date, education and skill dimensions) for roll-up, drill-down, slice, dice and pivot reports.</p><p><b>Data mining</b> adds TF-IDF matching, K-Means clustering, a Decision Tree and association rules.</p><p class="note">All data here is synthetic sample data.</p></div>`)}};
const names={rank:"Rank candidates",match:"Match a profile",wh:"Warehouse reports",mine:"Data mining",live:"Live backend",about:"About"};
const nav=document.getElementById("nav"),v=document.getElementById("v");
function show(k){nav.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.k==k));v.innerHTML="";v.append(V[k]())}
Object.keys(names).forEach(k=>{const b=document.createElement("button");b.textContent=names[k];b.dataset.k=k;b.onclick=()=>show(k);nav.append(b)});
show("rank");
</script></body></html>
